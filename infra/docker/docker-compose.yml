version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  sqs:
    image: softwaremill/elasticmq-native:1.6.6
    container_name: nexus-elasticmq
    restart: unless-stopped
    ports:
      - "9324:9324"
      - "9325:9325"

  temporal:
    image: temporalio/dev-server:1.24.0
    container_name: nexus-temporal
    restart: unless-stopped
    command: ["--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"

  mailpit:
    image: axllent/mailpit:latest
    container_name: nexus-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
